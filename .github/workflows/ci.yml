name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r ml-service/requirements.txt
      - run: PYTHONPATH=ml-service pytest ml-service/tests -q

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore NeuroForge.sln
      - run: dotnet build NeuroForge.sln --configuration Release --no-restore
      - run: dotnet test NeuroForge.sln --configuration Release --no-build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [python-tests, dotnet]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NeuroForge.Api/Dockerfile
          push: false
          tags: neuroforge-agent-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: false
          tags: neuroforge-ml-service:ci
